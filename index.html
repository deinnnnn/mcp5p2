<!DOCTYPE html>
<html>
<head>
    <title>Search for a Value</title>
</head>
<body>

    <h1>Search for a Value</h1>

    <label>Enter numbers separated by commas:</label>
    <br>
    <input type="text" id="arrayInput">

    <br><br>

    <label>Enter value to search:</label>
    <br>
    <input type="text" id="searchValue">

    <br><br>

    <button onclick="searchArray()">Search</button>

    <h2>Result:</h2>
    <p id="result"></p>

    <script>
        function searchArray() {

            let input = document.getElementById("arrayInput").value;
            let searchValue = document.getElementById("searchValue").value.trim();

            let array = [];
            let value = "";

            // Gumawa ng array nang hindi gumagamit ng split()
            for (let i = 0; i <= input.length; i++) {

                if (input[i] == "," || i == input.length) {

                    array.push(value.trim());
                    value = "";

                } else {
                    value += input[i];
                }
            }

            let found = false;

            // Hanapin ang value
            for (let i = 0; i < array.length; i++) {

                if (array[i] == searchValue) {

                    document.getElementById("result").innerHTML =
                        'Value "' + searchValue + '" found at index ' + i + '.';

                    found = true;
                    break;
                }
            }

            if (found == false) {

                document.getElementById("result").innerHTML =
                    'Value "' + searchValue + '" does not exist in the array.';
            }
        }
    </script>

</body>
</html>
